[project]
name = "bdc-db"
description = "A database management extension for Brazil Data Cube Applications and Services."
readme = "README.rst"
requires-python = ">=3.8"
license = "GPL-3.0-only"
authors = [
    {name = "Brazil Data Cube Team", email = "bdc.team@inpe.br"},
]
keywords = [
    "database",
    "postgres",
    "bdc",
    "big",
    "orm",
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
version="0.8.0"
dependencies = [
    "Flask>=2",
    "Flask-SQLAlchemy>=3.0",
    "Flask-Alembic>=2.0.0,<3.2.0",
    "invenio-jsonschemas>=1.1.4",
    "jsonschema>=3",
    "psycopg2-binary>=2.8",
    "SQLAlchemy>=1.3",
    "SQLAlchemy-Utils>=0.40.0",
    "alembic>=1.12",
]

# Extras Dependencies
[project.optional-dependencies]
dev = ["pre-commit"]
docs = [
    "Sphinx>=7.0",
    "sphinx_rtd_theme",
    "sphinx-copybutton",
    "sphinx-tabs",
]
tests = [
    "coverage>=6.4",
    "coveralls>=3.3",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pydocstyle>=4.0",
    "isort>4.3",
    "check-manifest>=0.40",
]
all = ["bdc-db[docs,tests]"]
## End extras dependencies

[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bdc_db*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
"bdc_db" = ["py.typed", "alembic/**"]

[project.urls]
Homepage = "https://github.com/brazil-data-cube/bdc-db"
Documentation = "https://github.com/brazil-data-cube/bdc-db"
Issues = "https://github.com/brazil-data-cube/bdc-db/-/issues"
Source = "https://github.com/brazil-data-cube/bdc-db"
# Changelog = ""

[project.scripts]
bdc-db = "bdc_db.cli:cli"
